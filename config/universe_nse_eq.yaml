# Every NSE equity in the EQ series: the candidate list of the point-in-time xs_v2 test
#   (config/edge_search_v3.yaml). A research universe only; these are NOT on the dashboard watchlist.
# FROZEN 2026-09-24. Source: the Fyers NSE_CM symbol master (https://public.fyers.in/sym_details/NSE_CM.csv),
#   downloaded 2026-09-24 (IST), written by python -m candly.data.universe_build. Do not regenerate it: a later
#   master lists a different set of stocks.
# Filter: exchange instrument type 0 (equity) and series EQ.
#   2319 of 10013 rows kept. Excluded, by instrument type first and then by series:
#     124  indices (type 10)
#     351  ETFs (type 9)
#      99  mutual fund units (type 8)
#    6201  bonds, debentures, SGBs, SDLs, G-secs and T-bills (types 2, 5, 6, 7)
#      27  REITs and InvITs (series RR, IV)
#     572  SME listings (series SM, ST, SZ)
#     320  other series (not EQ)
#   Other series: BE 238, SF 50, BZ 27, E1 2, IT 1, W1 1, D1 1.
#   Fallback: an equity row with a fund ISIN (INF...) would count as an ETF.
# SURVIVORSHIP BIAS: stocks delisted or merged before 2026-09-24 are missing (Fyers serves listed symbols only),
#   and so are stocks that are listed today in another series (e.g. BE). Results on it are an upper bound.
# No industry field: the master has none, so xs_panel.universe_members reads every stock as "unknown".
# Candles go to the same store as the watchlist (data/candles/NSE/1D/<SYMBOL>.parquet).
# Backfill: python -m candly.data.universe_backfill --universe nse_eq   (progress: add --status)
# Fields: id and symbol (NSE), name and isin from the master, sources.fyers = the master's ticker.

