[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "candly"
version = "0.1.0"
description = "Candlestick pattern and context forecasting for Indian markets (NSE, BSE, MCX)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.13",
  "pyarrow>=17",
  "duckdb>=1.1",
  "httpx>=0.27",
  "feedparser>=6.0",
  "apscheduler>=3.10,<4",
  "pyyaml>=6.0",
  "tzdata>=2024.1",
  "yfinance>=0.2.54",
  "lightgbm>=4.5",
  "scikit-learn>=1.5",
  "anthropic>=1.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "respx>=0.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the real internet; skipped unless run with -m network"]
addopts = "-m \"not network\""

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
